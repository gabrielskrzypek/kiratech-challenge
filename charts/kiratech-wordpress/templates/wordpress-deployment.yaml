apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordpress
  namespace: {{ .Release.Namespace | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      tier: frontend
  template:
    metadata:
      labels:
        app: wordpress
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        tier: frontend
    spec:
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image | quote }}
          imagePullPolicy: {{ .Values.wordpress.imagePullPolicy | quote }}
          env:
{{- if .Values.wordpress.disableAutomaticUpdates }}
            - name: WORDPRESS_CONFIG_EXTRA
              value: "define('AUTOMATIC_UPDATER_DISABLED', true);"
{{- end }}
            - name: WORDPRESS_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: host
            - name: WORDPRESS_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: database
            - name: WORDPRESS_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: username
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: password
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /wp-login.php
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-content
