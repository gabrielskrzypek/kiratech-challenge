existingSecret: mysql-credentials

database:
  name: wordpress
  username: wordpress

mysql:
  image: mysql:8.4.13
  imagePullPolicy: IfNotPresent
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

wordpress:
  image: wordpress:7.1.3-php8.3-apache@sha256:d42f63cb89ad0eab272c4b393164e63830d0df270009907919f7dcce52b1a20b
  imagePullPolicy: IfNotPresent
  disableAutomaticUpdates: false
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
